<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 880" role="img" aria-labelledby="title desc">
  <title id="title">Webcode iPhone scroll mockup</title>
  <desc id="desc">Neutral smartphone frame for a vertically scrolling mobile website image.</desc>
  <defs>
    <linearGradient id="phone-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#596274"/>
      <stop offset="0.18" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#030712"/>
      <stop offset="0.82" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#697386"/>
    </linearGradient>
    <linearGradient id="frame-highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0.7"/>
      <stop offset="0.08" stop-color="#334155" stop-opacity="0.15"/>
      <stop offset="0.92" stop-color="#334155" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="phone-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <mask id="frame-mask">
      <rect width="430" height="880" fill="white"/>
      <rect x="54" y="42" width="322" height="796" rx="43" fill="black"/>
    </mask>
  </defs>
  <ellipse cx="215" cy="850" rx="150" ry="14" fill="#0b1020" opacity="0.2" filter="url(#phone-shadow)"/>
  <rect x="30" y="180" width="7" height="54" rx="3.5" fill="#111827"/>
  <rect x="30" y="252" width="7" height="88" rx="3.5" fill="#111827"/>
  <rect x="393" y="230" width="7" height="112" rx="3.5" fill="#111827"/>
  <rect x="34" y="18" width="362" height="844" rx="62" fill="url(#phone-frame)" stroke="#111827" stroke-width="2" mask="url(#frame-mask)"/>
  <rect x="39" y="23" width="352" height="834" rx="57" fill="none" stroke="url(#frame-highlight)" stroke-width="2" opacity="0.8"/>
  <rect x="54" y="42" width="322" height="796" rx="43" fill="none" stroke="#020617" stroke-width="3"/>
  <rect x="159" y="56" width="112" height="32" rx="16" fill="#02040a"/>
  <circle cx="252" cy="72" r="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="252" cy="72" r="1.6" fill="#2563eb" opacity="0.65"/>
</svg>
